<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karten Zähler</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #1c1c1e; color: #fff; max-width: 500px; margin: auto; }
    h1, h2 { text-align: center; }
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-buttons button { flex: 1; padding: 12px; background: #3a3a3c; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .tab-buttons button.active { background: #0a84ff; }
    .card { background: #2c2c2e; padding: 20px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; color: #aeaeb2; }
    input, select, button.action-btn { width: 100%; padding: 14px; margin-top: 6px; border-radius: 10px; border: none; font-size: 16px; box-sizing: border-box; }
    input, select { background: #3a3a3c; color: #fff; }
    button.action-btn { background: #30d158; color: #000; font-weight: bold; margin-top: 18px; cursor: pointer; font-size: 18px; }
    .history-item { background: #2c2c2e; padding: 12px; border-radius: 10px; margin-top: 8px; font-size: 15px; border-left: 4px solid #0a84ff; }
    .score-board { display: flex; justify-content: space-between; font-size: 24px; font-weight: bold; background: #3a3a3c; padding: 15px; border-radius: 10px; }
  </style>
</head>
<body>

  <h1>Karten Zähler</h1>

  <div class="tab-buttons">
    <button id="btn-30ab" class="active" onclick="switchMode('30ab')">30 Ab</button>
    <button id="btn-binokel" onclick="switchMode('binokel')">Bimokel</button>
  </div>

  <div class="card">
    <div class="score-board">
      <span>Punktestand:</span>
      <span id="score">30</span>
    </div>

    <!-- 30 AB BEREICH -->
    <div id="section-30ab">
      <label for="trumpf">Trumpffarbe wählen:</label>
      <select id="trumpf">
        <option value="karo">♦ Karo</option>
        <option value="pik">♠ Pik</option>
        <option value="kreuz">♣ Kreuz</option>
        <option value="herz">♥ Herz (Zählt doppelt!)</option>
      </select>

      <label for="stiche">Gemachte Stiche (0 bis 6):</label>
      <input type="number" id="stiche" min="0" max="6" value="0">
    </div>

    <!-- BIMOKEL BEREICH -->
    <div id="section-binokel" style="display: none;">
      <label for="melde">Meldedaten / Gemeldet:</label>
      <input type="number" id="melde" value="0">

      <label for="gemacht">Gemachte Punkte:</label>
      <input type="number" id="gemacht" value="0">
    </div>

    <button class="action-btn" onclick="rundeBerechnen()">Runde eintragen</button>
  </div>

  <h2>Spielverlauf</h2>
  <div id="history"></div>

  <script>
    let mode = '30ab';
    let punkte = 30;
    let rundenZaehler = 1;

    function switchMode(newMode) {
      mode = newMode;
      document.getElementById("btn-30ab").className = mode === '30ab' ? 'active' : '';
      document.getElementById("btn-binokel").className = mode === 'binokel' ? 'active' : '';
      document.getElementById("section-30ab").style.display = mode === '30ab' ? 'block' : 'none';
      document.getElementById("section-binokel").style.display = mode === 'binokel' ? 'block' : 'none';
      
      punkte = mode === '30ab' ? 30 : 0;
      document.getElementById("score").innerText = punkte;
      document.getElementById("history").innerHTML = '';
      rundenZaehler = 1;
    }

    function rundeBerechnen() {
      const historyDiv = document.getElementById("history");
      const eintrag = document.createElement("div");
      eintrag.className = "history-item";

      if (mode === '30ab') {
        const trumpf = document.getElementById("trumpf").value;
        let stiche = parseInt(document.getElementById("stiche").value) || 0;

        if (stiche < 0) stiche = 0;
        if (stiche > 6) stiche = 6;

        let abzug = stiche;
        if (trumpf === "herz") {
          abzug = stiche * 2;
        }

        punkte -= abzug;
        document.getElementById("score").innerText = punkte;
        
        const trumpfName = trumpf.toUpperCase();
        eintrag.innerHTML = `<b>Runde ${rundenZaehler} (30 ab):</b> ${trumpfName} | ${stiche} Stiche (-${abzug} Pkt.) &rarr; <b>Rest: ${punkte}</b>`;

        if (punkte <= 0) alert("Gewonnen! Punktzahl ist bei 0.");

      } else {
        let melde = parseInt(document.getElementById("melde").value) || 0;
        let gemacht = parseInt(document.getElementById("gemacht").value) || 0;
        let gewinn = melde + gemacht;

        punkte += gewinn;
        document.getElementById("score").innerText = punkte;

        eintrag.innerHTML = `<b>Runde ${rundenZaehler} (Bimokel):</b> Melden: ${melde} + Punkte: ${gemacht} (+${gewinn} Pkt.) &rarr; <b>Gesamt: ${punkte}</b>`;
      }

      historyDiv.prepend(eintrag);
      rundenZaehler++;
    }
  </script>
</body>
</html>
